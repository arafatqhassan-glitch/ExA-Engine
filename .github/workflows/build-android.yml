name: Build ExA Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Set up Android NDK & SDK Tools
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;21.4.7075529" "build-tools;28.0.3" "platforms;android-28"

      - name: Auto-Bundle minetest_game into Assets
        run: |
          mkdir -p android/assets/games/
          if [ ! -d "android/assets/games/minetest_game" ]; then
            git clone --depth 1 --branch 0.4.10 https://github.com/minetest/minetest_game.git android/assets/games/minetest_game
          fi

      - name: Build Native C++ Library with NDK
        run: |
          cd android
          $ANDROID_HOME/ndk/21.4.7075529/ndk-build -j$(nproc)

      - name: Compile Java & Package APK
        run: |
          sudo apt-get update && sudo apt-get install -y ant
          cd android
          android update project -p . -t android-28 || true
          ant debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExA-Engine-Android-Debug
          path: |
            android/bin/*-debug.apk
            android/app/build/outputs/apk/debug/*.apk
            
