name: Build ExA Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Configure Android SDK without requiring deprecated 'tools' package
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11.0

      - name: Accept SDK Licenses & Install NDK / CMake
        run: |
          yes | sdkmanager --licenses
          sdkmanager "ndk;25.2.9519653" "cmake;3.22.1" "build-tools;33.0.2"

      - name: Auto-Bundle minetest_game into Assets
        run: |
          mkdir -p android/assets/games/
          if [ ! -d "android/assets/games/minetest_game" ]; then
            git clone --depth 1 --branch 0.4.10 https://github.com/minetest/minetest_game.git android/assets/games/minetest_game
          fi

      - name: Build Android APK
        run: |
          cd android
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExA-Engine-Android-Debug
          path: android/app/build/outputs/apk/debug/*.apk
          
