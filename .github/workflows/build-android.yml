name: Build ExA Android Engine

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android NDK & Build Dependencies
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;25.2.9519653" "cmake;3.22.1" "build-tools;33.0.2" "platforms;android-31"

      - name: Auto-Bundle minetest_game into Assets
        run: |
          mkdir -p android/assets/games/
          if [ ! -d "android/assets/games/minetest_game" ]; then
            git clone --depth 1 --branch 0.4.10 https://github.com/minetest/minetest_game.git android/assets/games/minetest_game
          fi

      - name: Build Native Engine Libraries (ARM64, ARMv7, x86, x86_64)
        run: |
          mkdir -p build-android
          cd build-android
          cmake ../src \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_HOME/ndk/25.2.9519653/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI="arm64-v8a;armeabi-v7a;x86;x86_64" \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ExA-Engine-MultiABI-Binaries
          path: |
            build-android/bin/*
            build-android/lib*.so
            build-android/**/libexa.so
            
