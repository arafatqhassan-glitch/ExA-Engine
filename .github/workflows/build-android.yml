      - name: Locate Irrlicht Headers and Build Engine
        run: |
          if [ -f "CMakeLists.txt" ]; then
            SRC_DIR="$(pwd)"
          elif [ -f "src/CMakeLists.txt" ]; then
            SRC_DIR="$(pwd)/src"
          else
            SRC_DIR=$(find . -maxdepth 2 -name "CMakeLists.txt" | head -n 1 | xargs dirname | xargs readlink -f)
          fi

          # Find Irrlicht include dir if bundled inside source tree
          IRR_INC=$(find "$SRC_DIR" -type d -name "include" | grep -i "irrlicht" | head -n 1)
          if [ -z "$IRR_INC" ]; then
            IRR_INC="$SRC_DIR/lib/irrlicht/include"
          fi

          echo "Found CMakeLists.txt at: $SRC_DIR"
          echo "Using Irrlicht Include Dir: $IRR_INC"

          ABIS=("arm64-v8a" "armeabi-v7a" "x86" "x86_64")

          for ABI in "${ABIS[@]}"; do
            echo "=========================================="
            echo " Building native library for ABI: $ABI "
            echo "=========================================="
            
            BUILD_DIR="build-android-$ABI"
            mkdir -p "$BUILD_DIR"
            
            cmake -B "$BUILD_DIR" -S "$SRC_DIR" -G "Ninja" \
              -DCMAKE_TOOLCHAIN_FILE=$ANDROID_HOME/ndk/25.2.9519653/build/cmake/android.toolchain.cmake \
              -DANDROID_ABI="$ABI" \
              -DANDROID_PLATFORM=android-21 \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_CLIENT=0 \
              -DBUILD_SERVER=1 \
              -DENABLE_GLES=1 \
              -DENABLE_SOUND=0 \
              -DENABLE_CURL=0 \
              -DENABLE_GETTEXT=0 \
              -DIRRLICHT_INCLUDE_DIR="$IRR_INC"
            
            cmake --build "$BUILD_DIR" --parallel $(nproc)
            
            mkdir -p "android/libs/$ABI"
            find "$BUILD_DIR" -name "libexa.so" -exec cp {} "android/libs/$ABI/" \; || true
            find "$BUILD_DIR" -name "lib*.so" -exec cp {} "android/libs/$ABI/" \; || true
          done
          
