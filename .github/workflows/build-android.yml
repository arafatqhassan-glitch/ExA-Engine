name: Build ExA Android Engine

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Unzip Source Code Package
        run: |
          if [ -f "ExA-Engine-0.4.10.zip" ]; then
            echo "Unzipping ExA-Engine-0.4.10.zip..."
            unzip -q ExA-Engine-0.4.10.zip
          elif [ -f "*.zip" ]; then
            echo "Unzipping zip package..."
            unzip -q *.zip
          fi

      - name: Install Android NDK, CMake & Ninja
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;25.2.9519653" "cmake;3.22.1" "build-tools;33.0.2" "platforms;android-31"
          sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Auto-Bundle minetest_game into Assets
        run: |
          mkdir -p android/assets/games/
          if [ ! -d "android/assets/games/minetest_game" ]; then
            git clone --depth 1 --branch 0.4.10 https://github.com/minetest/minetest_game.git android/assets/games/minetest_game
          fi

      - name: Build Native Engine Libraries for All ABIs
        run: |
          # Locate source directory containing CMakeLists.txt
          if [ -f "CMakeLists.txt" ]; then
            SRC_DIR="$(pwd)"
          elif [ -f "src/CMakeLists.txt" ]; then
            SRC_DIR="$(pwd)/src"
          else
            SRC_DIR=$(find . -maxdepth 2 -name "CMakeLists.txt" | head -n 1 | xargs dirname | xargs readlink -f)
          fi

          echo "Found CMakeLists.txt at: $SRC_DIR"

          ABIS=("arm64-v8a" "armeabi-v7a" "x86" "x86_64")

          for ABI in "${ABIS[@]}"; do
            echo "=========================================="
            echo " Building native library for ABI: $ABI "
            echo "=========================================="
            
            BUILD_DIR="build-android-$ABI"
            mkdir -p "$BUILD_DIR"
            
            cmake -B "$BUILD_DIR" -S "$SRC_DIR" -G "Ninja" \
              -DCMAKE_TOOLCHAIN_FILE=$ANDROID_HOME/ndk/25.2.9519653/build/cmake/android.toolchain.cmake \
              -DANDROID_ABI="$ABI" \
              -DANDROID_PLATFORM=android-21 \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_CLIENT=0 \
              -DBUILD_SERVER=1 \
              -DENABLE_GLES=1 \
              -DENABLE_SOUND=0 \
              -DENABLE_CURL=0 \
              -DENABLE_GETTEXT=0
            
            cmake --build "$BUILD_DIR" --parallel $(nproc)
            
            # Copy compiled shared/static outputs
            mkdir -p "android/libs/$ABI"
            find "$BUILD_DIR" -name "libexa.so" -exec cp {} "android/libs/$ABI/" \; || true
            find "$BUILD_DIR" -name "lib*.so" -exec cp {} "android/libs/$ABI/" \; || true
          done

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ExA-Engine-MultiABI-Binaries
          path: |
            android/libs/*/*.so
            build-android-*/**/*.so
            
